[project]
name = "powerpoint-accessibility-mcp"
version = "2.0.0"
description = "MCP server and agent skill that make PowerPoint decks WCAG 2.1 AA accessible through desktop PowerPoint on Windows, keeping their look and animations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo Rodriguez Jr" }]
keywords = ["mcp", "powerpoint", "accessibility", "a11y", "wcag", "section-508", "alt-text", "pywin32"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "mcp>=2.2,<3",
    "pywin32>=311",
    "openpyxl>=3.1",
    "pillow>=10",
    "pywinauto>=0.6.9",
]

[project.scripts]
ppt-a11y-mcp = "ppta11y.server:main"
ppt-a11y = "ppta11y.cli:entry"

[project.urls]
Homepage = "https://github.com/ricardofrodriguezjr/powerpoint-accessibility-mcp"
Issues = "https://github.com/ricardofrodriguezjr/powerpoint-accessibility-mcp/issues"
Upstream = "https://github.com/Ayushmaniar/powerpoint-mcp"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppta11y"]
