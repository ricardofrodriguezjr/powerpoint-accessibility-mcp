<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">PowerPoint Accessibility MCP</title>
  <desc id="d">Make PowerPoint slides WCAG 2.1 AA accessible with your AI assistant, keeping the same look and the same animations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2236"/>
      <stop offset="1" stop-color="#143A5C"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6E9F"/>
      <stop offset="1" stop-color="#3F8FCB"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5AAEEB"/>
      <stop offset="1" stop-color="#8CCBF5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <circle cx="1170" cy="40" r="170" fill="url(#blob)" opacity="0.55"/>
    <circle cx="905" cy="345" r="120" fill="#1D4B73" opacity="0.8"/>
    <rect x="1040" y="230" width="210" height="210" rx="48" fill="#2C6797" opacity="0.45" transform="rotate(18 1145 335)"/>
    <circle cx="70" cy="320" r="90" fill="#183F62" opacity="0.9"/>
    <circle cx="620" cy="-40" r="80" fill="#16385A"/>
  </g>

  <!-- slide card -->
  <g filter="url(#soft)">
    <rect x="860" y="62" width="300" height="200" rx="18" fill="#FFFFFF"/>
  </g>
  <rect x="860" y="62" width="300" height="38" rx="18" fill="url(#bar)"/>
  <rect x="860" y="82" width="300" height="18" fill="url(#bar)"/>
  <circle cx="884" cy="81" r="5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="902" cy="81" r="5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="920" cy="81" r="5" fill="#FFFFFF" opacity="0.5"/>
  <rect x="884" y="120" width="150" height="12" rx="6" fill="#2F7FC1"/>
  <rect x="884" y="146" width="120" height="9" rx="4.5" fill="#BBDDF7"/>
  <rect x="884" y="164" width="135" height="9" rx="4.5" fill="#BBDDF7"/>
  <rect x="884" y="182" width="100" height="9" rx="4.5" fill="#BBDDF7"/>
  <rect x="884" y="208" width="128" height="34" rx="9" fill="#EAF5FE" stroke="#9FD0F4" stroke-width="1.5"/>
  <text x="948" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2F7FC1">alt text added</text>

  <!-- accessibility badge -->
  <g transform="translate(1088 186)">
    <circle r="44" fill="#FFFFFF" filter="url(#soft)"/>
    <circle r="36" fill="#3D97DD"/>
    <circle cy="-17" r="5.5" fill="#FFFFFF"/>
    <path d="M-17 -6 L17 -6" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 -6 L0 7 M0 7 L-9 22 M0 7 L9 22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- check mark -->
  <g transform="translate(1004 296)">
    <rect x="-118" y="-20" width="236" height="40" rx="20" fill="#FFFFFF" stroke="#A9D6F7" stroke-width="1.5"/>
    <circle cx="-94" cy="0" r="11" fill="#45A3E5"/>
    <path d="M-99 0 L-95.5 4 L-89 -4" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-76" y="5" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E5E92">WCAG 2.1 AA ready</text>
  </g>

  <!-- words -->
  <text x="72" y="118" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2.5" fill="#7CC4F5">MCP SERVER + AGENT SKILL</text>
  <text x="70" y="174" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#EEF7FF">PowerPoint Accessibility</text>
  <text x="72" y="226" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="25" fill="#AFD3EE">Accessible slides from the decks you already have.</text>
  <text x="72" y="260" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="25" fill="#AFD3EE">Same look. Same animations. Every change logged.</text>
</svg>
